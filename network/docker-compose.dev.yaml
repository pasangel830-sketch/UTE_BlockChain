# Diario: 3 orderers Raft (quórum UteFull) + peers EmpresaA y Administración.
# Canal = UteFull (5 MSP). Peers B/C/D apagados; PDC requiredPeerCount 0.
# No combinar con docker-compose.full.yaml.

name: ute-dev

x-peer: &peer-resources
  mem_limit: 1g
  mem_reservation: 512m
  cpus: "0.50"

x-orderer: &orderer-resources
  mem_limit: 256m
  mem_reservation: 128m
  cpus: "0.25"

x-tools: &tools-resources
  mem_limit: 256m
  mem_reservation: 128m
  cpus: "0.25"

x-peer-env: &peer-common
  FABRIC_LOGGING_SPEC: INFO
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: ute-net
  CORE_PEER_TLS_ENABLED: "true"
  CORE_LEDGER_STATE_STATEDATABASE: goleveldb
  CORE_METRICS_PROVIDER: prometheus
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s
  CORE_CHAINCODE_INSTALLTIMEOUT: 300s

networks:
  ute:
    name: ute-net

volumes:
  peer0-empresaa:
  peer0-admin:
  orderer1:
  orderer2:
  orderer3:

services:
  orderer1.ute.local:
    <<: *orderer-resources
    image: hyperledger/fabric-orderer:2.5.16
    container_name: orderer1.ute.local
    hostname: orderer1.ute.local
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED: "true"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_METRICS_PROVIDER: prometheus
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8443
    volumes:
      - ./organizations/ordererOrganizations/ute.local/orderers/orderer1.ute.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/ute.local/orderers/orderer1.ute.local/tls:/var/hyperledger/orderer/tls
      - orderer1:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
      - "8443:8443"
    networks:
      - ute
    restart: unless-stopped

  orderer2.ute.local:
    <<: *orderer-resources
    image: hyperledger/fabric-orderer:2.5.16
    container_name: orderer2.ute.local
    hostname: orderer2.ute.local
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 8050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:8053
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED: "true"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_METRICS_PROVIDER: prometheus
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8444
    volumes:
      - ./organizations/ordererOrganizations/ute.local/orderers/orderer2.ute.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/ute.local/orderers/orderer2.ute.local/tls:/var/hyperledger/orderer/tls
      - orderer2:/var/hyperledger/production/orderer
    ports:
      - "8050:8050"
      - "8053:8053"
      - "8444:8444"
    networks:
      - ute
    restart: unless-stopped

  orderer3.ute.local:
    <<: *orderer-resources
    image: hyperledger/fabric-orderer:2.5.16
    container_name: orderer3.ute.local
    hostname: orderer3.ute.local
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 9050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:9053
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED: "true"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_METRICS_PROVIDER: prometheus
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:8445
    volumes:
      - ./organizations/ordererOrganizations/ute.local/orderers/orderer3.ute.local/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/ute.local/orderers/orderer3.ute.local/tls:/var/hyperledger/orderer/tls
      - orderer3:/var/hyperledger/production/orderer
    ports:
      - "9050:9050"
      - "9053:9053"
      - "8445:8445"
    networks:
      - ute
    restart: unless-stopped

  peer0.empresaa.ute.local:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.empresaa.ute.local
    hostname: peer0.empresaa.ute.local
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.empresaa.ute.local
      CORE_PEER_ADDRESS: peer0.empresaa.ute.local:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.empresaa.ute.local:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.empresaa.ute.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.empresaa.ute.local:7051
      CORE_PEER_LOCALMSPID: EmpresaAMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/empresaa.ute.local/peers/peer0.empresaa.ute.local/msp:/etc/hyperledger/peer/msp
      - ./organizations/peerOrganizations/empresaa.ute.local/peers/peer0.empresaa.ute.local/tls:/etc/hyperledger/peer/tls
      - peer0-empresaa:/var/hyperledger/production
    ports:
      - "7051:7051"
      - "9444:9444"
    networks:
      - ute
    depends_on:
      - orderer1.ute.local
    restart: unless-stopped

  peer0.administracion.ute.local:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.administracion.ute.local
    hostname: peer0.administracion.ute.local
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.administracion.ute.local
      CORE_PEER_ADDRESS: peer0.administracion.ute.local:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.administracion.ute.local:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.administracion.ute.local:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.administracion.ute.local:9051
      CORE_PEER_LOCALMSPID: AdministracionMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/administracion.ute.local/peers/peer0.administracion.ute.local/msp:/etc/hyperledger/peer/msp
      - ./organizations/peerOrganizations/administracion.ute.local/peers/peer0.administracion.ute.local/tls:/etc/hyperledger/peer/tls
      - peer0-admin:/var/hyperledger/production
    ports:
      - "9051:9051"
      - "9445:9445"
    networks:
      - ute
    depends_on:
      - orderer1.ute.local
    restart: unless-stopped

  cli:
    <<: *tools-resources
    image: hyperledger/fabric-tools:2.5.16
    container_name: ute-cli-dev
    tty: true
    stdin_open: true
    environment:
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
    volumes:
      - ./:/workspace
      - ./organizations:/organizations
      - ../chaincode:/chaincode
    working_dir: /workspace
    networks:
      - ute
    depends_on:
      - peer0.empresaa.ute.local
      - peer0.administracion.ute.local
    command: /bin/bash
    restart: unless-stopped
