# Peers B/C/D un rato sobre la red diaria (ute-net). No toca volúmenes de A/Admin/orderers.
# Uso: make pdc-up / make pdc-down

name: ute-pdc

x-peer: &peer-resources
  mem_limit: 512m
  mem_reservation: 256m
  cpus: "0.45"

x-peer-env: &peer-common
  FABRIC_LOGGING_SPEC: INFO
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: ute-net
  CORE_PEER_TLS_ENABLED: "true"
  CORE_LEDGER_STATE_STATEDATABASE: goleveldb
  CORE_METRICS_PROVIDER: prometheus
  CORE_CHAINCODE_EXECUTETIMEOUT: 300s
  CORE_CHAINCODE_INSTALLTIMEOUT: 300s

networks:
  ute:
    name: ute-net
    external: true

volumes:
  peer0-empresab:
  peer0-empresac:
  peer0-empresad:

services:
  peer0.empresab.ute.local:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.empresab.ute.local
    hostname: peer0.empresab.ute.local
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.empresab.ute.local
      CORE_PEER_ADDRESS: peer0.empresab.ute.local:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0.empresab.ute.local:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.empresab.ute.local:8051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.empresab.ute.local:8051
      CORE_PEER_LOCALMSPID: EmpresaBMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9446
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/empresab.ute.local/peers/peer0.empresab.ute.local/msp:/etc/hyperledger/peer/msp
      - ./organizations/peerOrganizations/empresab.ute.local/peers/peer0.empresab.ute.local/tls:/etc/hyperledger/peer/tls
      - peer0-empresab:/var/hyperledger/production
    ports:
      - "8051:8051"
      - "9446:9446"
    networks: [ute]
    restart: unless-stopped

  peer0.empresac.ute.local:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.empresac.ute.local
    hostname: peer0.empresac.ute.local
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.empresac.ute.local
      CORE_PEER_ADDRESS: peer0.empresac.ute.local:11051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_CHAINCODEADDRESS: peer0.empresac.ute.local:11052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:11052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.empresac.ute.local:11051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.empresac.ute.local:11051
      CORE_PEER_LOCALMSPID: EmpresaCMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9447
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/empresac.ute.local/peers/peer0.empresac.ute.local/msp:/etc/hyperledger/peer/msp
      - ./organizations/peerOrganizations/empresac.ute.local/peers/peer0.empresac.ute.local/tls:/etc/hyperledger/peer/tls
      - peer0-empresac:/var/hyperledger/production
    ports:
      - "11051:11051"
      - "9447:9447"
    networks: [ute]
    restart: unless-stopped

  peer0.empresad.ute.local:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.empresad.ute.local
    hostname: peer0.empresad.ute.local
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.empresad.ute.local
      CORE_PEER_ADDRESS: peer0.empresad.ute.local:12051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:12051
      CORE_PEER_CHAINCODEADDRESS: peer0.empresad.ute.local:12052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:12052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.empresad.ute.local:12051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.empresad.ute.local:12051
      CORE_PEER_LOCALMSPID: EmpresaDMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9448
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/empresad.ute.local/peers/peer0.empresad.ute.local/msp:/etc/hyperledger/peer/msp
      - ./organizations/peerOrganizations/empresad.ute.local/peers/peer0.empresad.ute.local/tls:/etc/hyperledger/peer/tls
      - peer0-empresad:/var/hyperledger/production
    ports:
      - "12051:12051"
      - "9448:9448"
    networks: [ute]
    restart: unless-stopped
