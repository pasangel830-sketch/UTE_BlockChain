  peer0.empresaa.ute.prod:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.empresaa.ute.prod
    hostname: peer0.empresaa.ute.prod
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.empresaa.ute.prod
      CORE_PEER_ADDRESS: peer0.empresaa.ute.prod:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.empresaa.ute.prod:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.empresaa.ute.prod:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.empresaa.ute.prod:7051
      CORE_PEER_LOCALMSPID: EmpresaAMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations-prod/peerOrganizations/empresaa.ute.prod/peers/peer0.empresaa.ute.prod/msp:/etc/hyperledger/peer/msp
      - ./organizations-prod/peerOrganizations/empresaa.ute.prod/peers/peer0.empresaa.ute.prod/tls:/etc/hyperledger/peer/tls
      - peer0-empresaa:/var/hyperledger/production
    ports:
      - "${OPS_BIND:-0.0.0.0}:9444:9444"
    networks: [ute]
    restart: unless-stopped

  peer0.empresab.ute.prod:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.empresab.ute.prod
    hostname: peer0.empresab.ute.prod
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.empresab.ute.prod
      CORE_PEER_ADDRESS: peer0.empresab.ute.prod:8051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:8051
      CORE_PEER_CHAINCODEADDRESS: peer0.empresab.ute.prod:8052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:8052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.empresab.ute.prod:8051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.empresab.ute.prod:8051
      CORE_PEER_LOCALMSPID: EmpresaBMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9446
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations-prod/peerOrganizations/empresab.ute.prod/peers/peer0.empresab.ute.prod/msp:/etc/hyperledger/peer/msp
      - ./organizations-prod/peerOrganizations/empresab.ute.prod/peers/peer0.empresab.ute.prod/tls:/etc/hyperledger/peer/tls
      - peer0-empresab:/var/hyperledger/production
    ports:
      - "${OPS_BIND:-0.0.0.0}:9446:9446"
    networks: [ute]
    restart: unless-stopped

  peer0.empresac.ute.prod:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.empresac.ute.prod
    hostname: peer0.empresac.ute.prod
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.empresac.ute.prod
      CORE_PEER_ADDRESS: peer0.empresac.ute.prod:11051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_CHAINCODEADDRESS: peer0.empresac.ute.prod:11052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:11052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.empresac.ute.prod:11051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.empresac.ute.prod:11051
