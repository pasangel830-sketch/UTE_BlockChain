      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.administracion.ute.prod:9051
      CORE_PEER_LOCALMSPID: AdministracionMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations-prod/peerOrganizations/administracion.ute.prod/peers/peer0.administracion.ute.prod/msp:/etc/hyperledger/peer/msp
      - ./organizations-prod/peerOrganizations/administracion.ute.prod/peers/peer0.administracion.ute.prod/tls:/etc/hyperledger/peer/tls
      - peer0-admin:/var/hyperledger/production
    ports:
      - "${OPS_BIND:-0.0.0.0}:9445:9445"
    networks: [ute]
    restart: unless-stopped

  cli:
    <<: *tools-resources
    image: hyperledger/fabric-tools:2.5.16
    container_name: ute-cli-prod
    tty: true
    stdin_open: true
    environment:
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
    volumes:
      - ./:/workspace
      - ./organizations-prod:/organizations
      - ../chaincode:/chaincode
    working_dir: /workspace
    networks: [ute]
    command: /bin/bash
    restart: unless-stopped

  api:
    <<: *api-resources
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ute-api:prod
    container_name: ute-api
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obligatorio en prod}
      JWT_EXPIRES: 8h
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      AUTH_USERS: empresaA:empresaA:EmpresaAMSP,empresaB:empresaB:EmpresaBMSP,empresaC:empresaC:EmpresaCMSP,empresaD:empresaD:EmpresaDMSP,administracion:administracion:AdministracionMSP
      PEER_ENDPOINT: peer0.empresaa.ute.prod:7051
      PEER_HOST_ALIAS: peer0.empresaa.ute.prod
      FABRIC_DOMAIN: ute.prod
      CRYPTO_PATH: /crypto
      CHANNEL_NAME: channel-obra
      CHAINCODE_HITO: hito
      CHAINCODE_PAGO: pago
      CHAINCODE_INCIDENCIA: incidencia
      CHAINCODE_ESTADO: estado-obra
      STORAGE_DRIVER: ${STORAGE_DRIVER:-gcs}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-ute-tfm}
      UPLOAD_DIR: /app/uploads
      MOCK_BANCO_URL: http://ute-api:4000/mock/banco/pagos
      GRPC_KEEPALIVE_TIME_MS: "120000"
      GRPC_KEEPALIVE_TIMEOUT_MS: "20000"
    volumes:
      - ./organizations-prod:/crypto:ro
      - api-uploads:/app/uploads
    extra_hosts:
      - "metadata.google.internal:169.254.169.254"
    ports:
      - "127.0.0.1:4000:4000"
    networks: [ute]
    depends_on:
      - peer0.empresaa.ute.prod
      - peer0.administracion.ute.prod
    restart: unless-stopped

  caddy:
    <<: *exporter-resources
    image: caddy:2.11.4
    container_name: ute-caddy
    environment:
      API_FQDN: ${API_FQDN:-localhost}
      GRAFANA_FQDN: ${GRAFANA_FQDN:-}
      GRAFANA_UPSTREAM: ${GRAFANA_UPSTREAM:-grafana:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks: [ute]
    depends_on:
      - api
    restart: unless-stopped

  cadvisor:
    <<: *exporter-resources
    profiles: ["exporters"]
    image: gcr.io/cadvisor/cadvisor:v0.56.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [ute]
    ports: []

  node-exporter:
    <<: *exporter-resources
    profiles: ["exporters"]
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [ute]
    ports: []
