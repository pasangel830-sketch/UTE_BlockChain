      CORE_PEER_ADDRESS: peer0.administracion.ute.prod:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.administracion.ute.prod:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
