      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/peer/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9447
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations-prod/peerOrganizations/empresac.ute.prod/peers/peer0.empresac.ute.prod/msp:/etc/hyperledger/peer/msp
      - ./organizations-prod/peerOrganizations/empresac.ute.prod/peers/peer0.empresac.ute.prod/tls:/etc/hyperledger/peer/tls
      - peer0-empresac:/var/hyperledger/production
    ports:
      - "${OPS_BIND:-0.0.0.0}:9447:9447"
    networks: [ute]
    restart: unless-stopped

  peer0.empresad.ute.prod:
    <<: *peer-resources
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.empresad.ute.prod
    hostname: peer0.empresad.ute.prod
    environment:
      <<: *peer-common
      CORE_PEER_ID: peer0.empresad.ute.prod
      CORE_PEER_ADDRESS: peer0.empresad.ute.prod:12051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:12051
      CORE_PEER_CHAINCODEADDRESS: peer0.empresad.ute.prod:12052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:12052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.empresad.ute.prod:12051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.empresad.ute.prod:12051
      CORE_PEER_LOCALMSPID: EmpresaDMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/peer/msp
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/peer/tls/server.key
