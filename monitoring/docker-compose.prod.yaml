# VM monitoring-ute (e2-small). Scrapea ops de fabric-ute por la VPC.
# No exponer Prometheus 9090 a Internet (firewall: 9090 solo 10.8.0.0/24).
# Grafana :3000 VPC (Caddy de fabric-ute hace /grafana). Caddy local 80/443 si hay GRAFANA_FQDN.

name: ute-monitoring-prod

x-limits: &mon-resources
  mem_limit: 512m
  mem_reservation: 128m
  cpus: "0.50"

x-caddy: &caddy-resources
  mem_limit: 128m
  mem_reservation: 32m
  cpus: "0.10"

networks:
  mon:
    name: ute-mon

volumes:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:

services:
  prometheus:
    <<: *mon-resources
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    extra_hosts:
      - "peer0.empresaa.ute.prod:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
      - "peer0.administracion.ute.prod:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
      - "peer0.empresab.ute.prod:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
      - "peer0.empresac.ute.prod:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
      - "peer0.empresad.ute.prod:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
      - "orderer1.ute.prod:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
      - "orderer2.ute.prod:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
      - "orderer3.ute.prod:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
      - "fabric-ute:${FABRIC_UTE_PRIVATE_IP:-10.8.0.2}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OPS_BIND:-0.0.0.0}:9090:9090"
    networks: [mon]

  grafana:
    <<: *mon-resources
    image: grafana/grafana:12.4.1
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: none
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-ute-tfm.duckdns.org}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://ute-tfm.duckdns.org/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${OPS_BIND:-0.0.0.0}:3000:3000"
    networks: [mon]
    depends_on:
      - prometheus

  caddy:
    <<: *caddy-resources
    image: caddy:2.11.4
    container_name: ute-caddy-mon
    restart: unless-stopped
    environment:
      GRAFANA_FQDN: ${GRAFANA_FQDN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks: [mon]
    depends_on:
      - grafana

  alert-demo:
    image: python:3.12-alpine
    container_name: ute-alert-demo
    restart: unless-stopped
    profiles: ["alert-demo"]
    command: ["python", "/exporter.py"]
    volumes:
      - ./alert-demo-exporter.py:/exporter.py:ro
    ports:
      - "127.0.0.1:9105:9105"
    networks: [mon]
