# Scrape de producción (VM monitoring-ute, día 13).
# Los peers/orderers publican ops en la VPC de fabric-ute (9444–9448, 8443–8445).
# Mapear *.ute.prod → IP privada de fabric-ute (extra_hosts) o sustituir por esa IP.
# API: REPLACE_PRIVATE_IP = IP privada de fabric-ute.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fabric-peers
    static_configs:
      - targets:
          - peer0.empresaa.ute.prod:9444
          - peer0.administracion.ute.prod:9445
        labels:
          role: required
      - targets:
          - peer0.empresab.ute.prod:9446
          - peer0.empresac.ute.prod:9447
          - peer0.empresad.ute.prod:9448
        labels:
          role: satellite

  - job_name: fabric-orderers
    static_configs:
      - targets:
          - orderer1.ute.prod:8443
          - orderer2.ute.prod:8444
          - orderer3.ute.prod:8445

  # IP privada de la VM fabric-ute (VPC). Sustituir REPLACE_PRIVATE_IP.
  - job_name: backend
    static_configs:
      - targets: ["REPLACE_PRIVATE_IP:4000"]
