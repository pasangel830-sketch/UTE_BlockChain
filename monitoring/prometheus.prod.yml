# Scrape de producción (VM monitoring-ute, día 13).
# extra_hosts en docker-compose.prod.yaml: *.ute.prod y fabric-ute → IP privada.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fabric-peers
    static_configs:
      - targets:
          - peer0.empresaa.ute.prod:9444
          - peer0.administracion.ute.prod:9445
        labels:
          role: required
      - targets:
          - peer0.empresab.ute.prod:9446
          - peer0.empresac.ute.prod:9447
          - peer0.empresad.ute.prod:9448
        labels:
          role: satellite

  - job_name: fabric-orderers
    static_configs:
      - targets:
          - orderer1.ute.prod:8443
          - orderer2.ute.prod:8444
          - orderer3.ute.prod:8445

  - job_name: backend
    static_configs:
      - targets: ["fabric-ute:4000"]

  - job_name: fabric-exporters
    static_configs:
      - targets:
          - fabric-ute:8080
          - fabric-ute:9100

  - job_name: alert-demo
    static_configs:
      - targets: ["alert-demo:9105"]
